[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.armv7-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"

[alias]
clippy-all = "clippy --all-targets --all-features -- -D warnings"
clippy-only = "clippy --all-targets  --features clippy -- -D warnings"

# Do not pin the Windows target linker here. Native Windows builds use the MSVC
# environment's link.exe; the macOS release script obtains lld-link and SDK library
# paths from `cargo xwin env`. A target-level setting cannot distinguish those hosts.
