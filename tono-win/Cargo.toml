[workspace]
members = [
  "crates/tono-core",
]
# The vendored IPC library keeps its own edition, lint table and toolchain floor, so it is
# excluded rather than made a member — but it must be listed, or cargo refuses to build it
# standalone ("believes it's in a workspace when it's not").
exclude = [
  "vendor/kode-bridge",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "LicenseRef-Proprietary"
authors = ["Raydocs"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
