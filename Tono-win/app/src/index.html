<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="shortcut icon"
      href="./assets/image/logo.ico"
      type="image/x-icon"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tono</title>
    <style>
      :root {
        --bg-color: #f5f5f5;
        --text-color: #333;
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #2e303d;
          --text-color: #ffffff;
          color-scheme: dark;
        }
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        color: var(--text-color);
      }

      #root {
        width: 100%;
        height: 100%;
      }

      #initial-loading-overlay {
        position: fixed;
        inset: 0;
        background: var(--bg-color);
        z-index: 9999;
        transition: opacity 0.2s ease-out;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
      }

      #initial-loading-overlay::before {
        content: 'Tono';
        font: 600 24px/1 system-ui, sans-serif;
        letter-spacing: 0.04em;
      }

      #initial-loading-overlay::after {
        content: '';
        width: 24px;
        height: 24px;
        border: 2px solid color-mix(in srgb, var(--text-color) 22%, transparent);
        border-top-color: var(--text-color);
        border-radius: 50%;
        animation: tono-initial-spin 0.8s linear infinite;
      }

      @keyframes tono-initial-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #initial-loading-overlay::after {
          animation-duration: 1.8s;
        }
      }

      #initial-loading-overlay[data-hidden='true'] {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="initial-loading-overlay"></div>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
